# Régénère le site (dist/) quand le contenu change et le recommite sur main.
# Cloudflare Pages publie ensuite dist/ (voir wrangler.toml) : une seule branche, une seule version.
# Les médias déjà produits sont dans dist/ : seuls les nouveaux ou modifiés sont refaits.
name: Générer le site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "media/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer ffmpeg (vidéos)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Enregistrer le site généré
        run: |
          git config user.name "urbn-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then echo "Rien à enregistrer."; else git commit -m "Générer le site [skip ci]" && git push; fi
