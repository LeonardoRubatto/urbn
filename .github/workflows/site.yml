# Génère le site à chaque modification du contenu et le dépose sur la branche « site ».
#   main → les sources (contenus, médias d’origine, gabarits, scripts, guides) : c’est ici qu’on publie.
#   site → uniquement le site généré (dist/), remplacé à chaque fois par un seul commit, sans historique.
# Cloudflare Pages publie la branche « site » telle quelle (aucune commande de build, dossier racine).
# Les images et vidéos déjà produites sont gardées en cache : seuls les médias nouveaux ou modifiés
# sont refaits (ffmpeg n’est installé que dans ce cas). Aucun secret à configurer.
name: Générer le site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "media/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Médias déjà produits (cache)
        id: medias
        uses: actions/cache@v4
        with:
          path: |
            dist/assets/img
            dist/assets/video
            dist/assets/medias.json
          key: medias-${{ hashFiles('media/**', 'content/medias.yml', 'scripts/media.mjs') }}
          restore-keys: medias-
      - name: Installer ffmpeg (vidéos)
        if: steps.medias.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Déposer le site sur la branche « site »
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: ./dist
          force_orphan: true
          user_name: urbn-build
          user_email: actions@users.noreply.github.com
          full_commit_message: "Site généré depuis ${{ github.sha }}"
