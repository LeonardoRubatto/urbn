# Registre des médias. Chaque image ou vidéo utilisée par le site est déclarée ici, une fois.
# Les fichiers originaux sont dans media/images/ et media/videos/ ; le build crée les versions web.
#
# Image :   clé: { fichier, alt, credit, source, cadrage }
#   - alt      : ce qu’on voit, pour les personnes qui ne voient pas l’image (obligatoire)
#   - credit   : auteur ou compte qui a publié la photo (obligatoire)
#   - source   : adresse de la publication d’origine (conseillé)
#   - cadrage  : point à garder visible quand l’image est recadrée, ex. "50% 30%" (facultatif)
#
# Vidéo :   clé: { fichier, titre, credit, source, film, affiche, boucles }
#   - film: true     → la vidéo entière est lisible sur le site (avec le son)
#   - affiche        → seconde de la vidéo utilisée comme image d’attente du film
#   - boucles        → extraits muets qui tournent en boucle : nom: { debut, duree, alt }
#                      on y renvoie ailleurs par « clé#nom », ex. dau-clash-7-retour#salle

